name: Automated ML Pipeline
on:
 push:
  branches:["main"]
pull_request:
  branches:["main"]
jobs:
    run-preprocessing:
      runs-on: ubuntu-latest
   steps:
#1.Checkout respository code
-name: Checkout Repository Code
       uses:actions/setup-python@v5
#2.Set up python environment-name:Set Up Python
       uses: actions/setup-python@v5
       with:
          python-version:"3.10"
          cache:'pip'
#3.Install project dependencies
-name: Install Dependencies
run: python -m pip install --upgrade pip
     pip install pandas scikit-learn pytest
#4.Run your preprocessing or test script-name:Run Preprocessing&Tests
run: python preprocessing.py
#Optional:Run pytest if you wrote unit tests for your data transforms
#pytest tests/
